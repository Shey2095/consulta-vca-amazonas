<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Afiliación</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f4f7f6; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        <!-- Encabezado -->
        <div class="bg-gradient-to-r from-teal-600 to-cyan-700 px-6 py-7 text-center text-white">
            <div class="mx-auto w-12 h-12 bg-white/10 backdrop-blur-md rounded-full flex items-center justify-center mb-2 border border-white/20">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 10.5V20a2 2 0 01-2 2H7a2 2 0 01-2-2v-9.5m14 0V9a2 2 0 00-2-2h-3.5M5 10.5V9a2 2 0 012-2h3.5m7.5 3.5H5M12 7V3m0 0L9 6m3-3l3 3" />
                </svg>
            </div>
            <h1 class="text-lg font-bold tracking-tight">Sistema de Consulta</h1>
            <p class="text-[11px] text-teal-100">Base de Datos de Afiliados Departamento de Salud</p>
        </div>

        <!-- Cuerpo -->
        <div class="p-6">
            <div class="space-y-3">
                <div>
                    <label for="documento" class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-2">Número de Documento</label>
                    <input type="text" id="documento" class="block w-full rounded-xl border border-slate-300 bg-slate-50 px-4 py-3 text-slate-800 focus:border-teal-500 focus:bg-white focus:outline-none focus:ring-2 focus:ring-teal-500/10 text-base transition-all" placeholder="Digita el número de identificación..." onkeypress="if(event.key === 'Enter') buscarAfiliado()">
                </div>
                <button onclick="buscarAfiliado()" id="btnBuscar" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-3 rounded-xl transition-all flex items-center justify-center gap-2 cursor-pointer shadow-sm">
                    Buscar Registro
                </button>
            </div>

            <!-- Cargando -->
            <div id="loader" class="hidden my-8 text-center space-y-2">
                <div class="w-7 h-7 border-4 border-teal-600 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-xs text-slate-400">Buscando afiliado...</p>
            </div>

            <!-- Resultados -->
            <div id="resultado" class="hidden mt-5"></div>
        </div>
        <div class="bg-slate-50 px-6 py-2.5 border-t border-slate-100 text-center"><p class="text-[9px] text-slate-400 font-medium">Uso interno autorizado • Información confidencial</p></div>
    </div>

    <script>
        function buscarAfiliado() {
            const documentoInput = document.getElementById('documento');
            const docValue = documentoInput.value.trim();
            const btnBuscar = document.getElementById('btnBuscar');
            const loader = document.getElementById('loader');
            const resultadoDiv = document.getElementById('resultado');

            if (!docValue) return;

            btnBuscar.disabled = true;
            resultadoDiv.classList.add('hidden');
            loader.classList.remove('hidden');

            // Enlace oficial ya integrado
            const URL_DE_TU_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzfgec8HDuuh2ECkWzk6_ay27EArYSsZc8DyyImj_P5vHUoRQiUJIwE1IKtjBbRky_3/exec";

            // Se realiza la petición externa limpia mediante parámetros de URL
            fetch(`${URL_DE_TU_APPS_SCRIPT}?documento=${encodeURIComponent(docValue)}`)
                .then(response => response.json())
                .then(response => {
                    loader.classList.add('hidden');
                    btnBuscar.disabled = false;
                    resultadoDiv.classList.remove('hidden');

                    if (response.encontrado) {
                        resultadoDiv.innerHTML = `
                            <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-3.5 shadow-inner animate-fadeIn">
                                <div class="flex items-center gap-2 bg-teal-50 border border-teal-100 p-2 rounded-lg text-teal-800">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                                    </svg>
                                    <span class="text-xs font-bold uppercase tracking-wider">Afiliado Encontrado</span>
                                </div>
                                <div class="grid grid-cols-1 gap-2.5 text-xs">
                                    <div class="flex justify-between items-center border-b border-slate-100 pb-1.5"><span class="text-slate-500 font-medium">Tipo de documento</span><span class="font-semibold text-slate-700">${response.tipoDoc}</span></div>
                                    <div class="flex justify-between items-center border-b border-slate-100 pb-1.5"><span class="text-slate-500 font-medium">Número de documento</span><span class="font-mono font-bold text-slate-800">${response.numDoc}</span></div>
                                    <div class="flex justify-between items-center border-b border-slate-100 pb-1.5"><span class="text-slate-500 font-medium">Iniciales</span><span class="font-bold text-teal-700 bg-teal-50 px-2 py-0.5 rounded border border-teal-100">${response.iniciales}</span></div>
                                    <div class="flex justify-between items-center border-b border-slate-100 pb-1.5"><span class="text-slate-500 font-medium">Sexo</span><span class="font-semibold text-slate-700">${response.sexo}</span></div>
                                    <div class="flex justify-between items-center border-b border-slate-100 pb-1.5"><span class="text-slate-500 font-medium">EPS</span><span class="font-semibold text-slate-800">${response.eps}</span></div>
                                    <div class="flex justify-between items-center pb-0.5"><span class="text-slate-500 font-medium">Régimen</span><span class="inline-flex items-center px-2 py-0.5 rounded-full text-[10px] font-bold uppercase ${response.regimen.toLowerCase().includes('sub') ? 'bg-amber-100 text-amber-800' : 'bg-blue-100 text-blue-800'}">${response.regimen}</span></div>
                                </div>
                            </div>`;
                    } else {
                        resultadoDiv.innerHTML = `
                            <div class="bg-rose-50 border border-rose-100 rounded-xl p-4 text-center space-y-2">
                                <div class="mx-auto w-8 h-8 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
                                    </svg>
                                </div>
                                <h3 class="font-bold text-rose-900 text-sm">No Encontrado</h3>
                                <p class="text-xs text-rose-700/90">El número de documento <span class="font-mono font-bold">${docValue}</span> no se encuentra registrado en el sistema.</p>
                            </div>`;
                    }
                })
                .catch(() => {
                    loader.classList.add('hidden');
                    btnBuscar.disabled = false;
                    resultadoDiv.classList.remove('hidden');
                    resultadoDiv.innerHTML = `<div class="p-3 bg-amber-50 text-amber-800 rounded-xl text-xs text-center border border-amber-200">Error al conectar. Verifica que la implementación en Apps Script esté publicada para "Cualquiera" (Anyone).</div>`;
                });
        }
    </script>
</body>
</html>
